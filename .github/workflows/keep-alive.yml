# Render's free plan sleeps after 15 min idle, which also pauses the reminder / daily-task cron jobs.
# Pinging every 10 min keeps zemp-api awake. ponytail: GitHub cron is best-effort (can lag a few min).
name: keep-alive
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 120 --retry 3 --retry-delay 20 https://zemp-api-ayxv.onrender.com/api/v1/health/live
