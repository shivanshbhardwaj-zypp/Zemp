# Render Blueprint for the ZEMP API. Dashboard → New → Blueprint → pick this repo.
# Connects to the existing `zemp-db` Postgres in the same workspace; migrations run on every start.
services:
  - type: web
    name: zemp-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @zemp/shared build && pnpm --filter @zemp/backend build
    startCommand: pnpm --filter @zemp/backend start
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://zemp-ten.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: zemp-db
          property: connectionString
      # Random secret for the Apps Script deadline digest — copy it from this service's
      # Environment tab into the script's DIGEST_SECRET property.
      - key: DIGEST_SECRET
        generateValue: true
