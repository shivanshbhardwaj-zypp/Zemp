packages:
  - frontend
  - backend
  - packages/*

# Install scripts run only where genuinely needed. unrs-resolver's native binary arrives as an
# optional dependency, so its fallback postinstall is unnecessary.
allowBuilds:
  '@embedded-postgres/windows-x64': true
  '@prisma/engines': true
  # Scarf's postinstall only reports install analytics; nothing depends on it.
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.3'
  - '@nestjs/schematics@12.0.3'

saveExact: true
